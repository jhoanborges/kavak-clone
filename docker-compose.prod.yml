services:
    web:
        build:
            context: '.'
            dockerfile: Dockerfile
            args:
                # NEXT_PUBLIC_* values baked from .env.production
                BUILD_ENV: production
        image: 'value-arrendadora:prod'
        ports:
            # -- Exposed host port - devops edits NEXT_PUBLIC_APP_PORT in .env --
            - '${NEXT_PUBLIC_APP_PORT:-8006}:3000'
        env_file:
            # Runtime env: copy `.env.production` -> `.env` on the prod host and fill the
            # real values there. `.env` is gitignored (never committed).
            - .env
        environment:
            NODE_ENV: production
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
