services:
    web:
        build:
            context: '.'
            dockerfile: Dockerfile
            args:
                BUILD_ENV: development
        image: 'value-arrendadora:dev'
        ports:
            # -- Exposed host port - devops edits NEXT_PUBLIC_APP_PORT in .env --
            - '${NEXT_PUBLIC_APP_PORT:-8008}:3000'
        env_file:
            # Runtime env (later wins). .env.local optional — personal overrides.
            - .env
            - .env.development
            - path: .env.local
              required: false
        environment:
            NODE_ENV: production
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: unless-stopped
